<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <link rel="canonical" href="https://umee02199.github.io/infovibe/pdfs.html" />
  <title>Documents & PDFs — InfoVibe</title>
  <meta name="description" content="Download free PDF documents and guides published on InfoVibe: cyber security checklists, AI prompt cookbooks, web performance guides and more." />
  <meta property="og:title" content="Documents & PDFs — InfoVibe" />
  <meta property="og:description" content="Free downloadable PDF documents and guides." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://umee02199.github.io/infovibe/pdfs.html" />
  <meta property="og:image" content="https://umee02199.github.io/infovibe/assets/img/og-default.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
</head>
<body>
  <div class="bg-blobs"><span></span><span></span><span></span></div>
  <div data-chrome-nav></div>

  <section class="section container">
    <h1 class="section-title">📄 Documents & PDFs</h1>
    <p class="section-sub">Free downloadable resources. View online or download to keep.</p>
    <div class="filter-bar">
      <input id="f-search" type="text" placeholder="🔍 Search documents…" style="flex:1;min-width:200px;" />
      <select id="f-cat"><option value="">All Categories</option></select>
    </div>
    <div class="doc-grid" id="pdf-grid"></div>
  </section>

  <div data-chrome-footer></div>
  <div data-chrome-floating></div>

  <script src="assets/js/components.js"></script>
  <script src="data/articles.js"></script>
  <script src="data/notes.js"></script>
  <script src="data/pdfs.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    (function () {
      const S = window.InfoVibeStore;
      const cats = S.getCategories();
      const pdfs = S.getPdfs();
      const esc = window.esc || (s => String(s).replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m])));
      document.getElementById("f-cat").innerHTML += cats.map(c => `<option value="${c.id}">${c.emoji} ${c.name}</option>`).join("");

      function render() {
        const q = document.getElementById("f-search").value.toLowerCase().trim();
        const cat = document.getElementById("f-cat").value;
        const list = pdfs.filter(p => (!cat || p.category === cat) && (!q || (p.title + " " + (p.description||"")).toLowerCase().includes(q)));
        document.getElementById("pdf-grid").innerHTML = list.length ? list.map(p => `
          <div class="doc-card-x tilt">
            <div class="doc-thumb">${p.thumbnail || "📄"}</div>
            <div class="doc-info">
              <div class="tag-row"><span class="tag">📄 ${ivCat(p.category).name}</span></div>
              <h3>${esc(p.title)}</h3>
              <p>${esc(p.description)}</p>
              <div class="doc-meta"><span>📅 ${esc(p.uploadDate)}</span><span>${esc(p.sizeLabel || "")}</span></div>
              <div class="doc-acts">
                <a class="btn btn-primary" href="${esc(p.path)}" target="_blank" rel="noopener">👁 View</a>
                <a class="btn btn-ghost" href="${esc(p.path)}" download>⬇ Download</a>
              </div>
            </div>
          </div>`).join("") : `<p class="empty">🤔 No documents found.</p>`;
      }
      ["f-search","f-cat"].forEach(id => document.getElementById(id).addEventListener("input", render));
      render();
    })();
  </script>
</body>
</html>
