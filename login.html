<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  
  <link rel="canonical" href="https://umee02199.github.io/infovibe/login.html" />
  <title>Login — InfoVibe</title>
  <meta name="description" content="Log in to your InfoVibe account to access your profile and saved content." />
  <meta property="og:title" content="Login — InfoVibe" />
  <meta property="og:description" content="Log in to your InfoVibe account." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://umee02199.github.io/infovibe/login.html" />
  <meta property="og:image" content="https://umee02199.github.io/infovibe/assets/img/og-default.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
</head>
<body>
  <div class="bg-blobs"><span></span><span></span><span></span></div>
  <div data-chrome-nav></div>
  <div class="auth-wrap">
    <div class="form-card">
      <h2>Welcome back 👋</h2>
      <p class="sub">Log in to your InfoVibe account.</p>
      <form onsubmit="ivDoLogin(event)">
        <div class="field"><label>Email</label><input id="l-email" type="email" required placeholder="you@email.com" /></div>
        <div class="field"><label>Password</label><input id="l-pass" type="password" required placeholder="••••••••" /></div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Log In</button>
      </form>
      <div class="note-box"><b>Demo mode:</b> Accounts are stored only in this browser (localStorage). No server, no real authentication — do not use a real password.</div>
      <div class="form-switch">New here? <a class="link" href="signup.html">Create an account</a></div>
    </div>
  </div>
  <div data-chrome-floating></div>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    window.ivDoLogin = async function (e) {
      e.preventDefault();
      const r = await ivLogin(document.getElementById("l-email").value.trim(), document.getElementById("l-pass").value);
      ivToast(r.msg);
      if (r.ok) setTimeout(() => location.href = "profile.html", 700);
    };
    // redirect if already logged in
    if (ivGetSession()) location.href = "profile.html";
  </script>
</body>
</html>
