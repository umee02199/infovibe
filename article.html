<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — InfoVibe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
</head>
<body>
  <div class="bg-blobs"><span></span><span></span><span></span></div>
  <div data-chrome-nav></div>

  <article class="section container article-layout">
    <div class="article-main">
      <a href="articles.html" class="chip">← Back to Articles</a>
      <div class="article-hero">
        <div class="tag-row" id="a-tags"></div>
        <h1 id="a-title">Loading…</h1>
        <p class="a-desc" id="a-desc"></p>
        <div class="article-meta">
          <div class="author"><div class="author-avatar" id="a-avatar">?</div><div><b id="a-author">—</b><br><span id="a-date"></span></div></div>
          <span class="chip" id="a-read"></span>
        </div>
        <div class="article-cover" id="a-cover">📄</div>
        <div id="a-media"></div>
      </div>

      <div class="prose" id="a-body"></div>

      <!-- References / sources -->
      <section class="refs" id="a-refs" style="display:none;">
        <h3>📚 References & Sources</h3>
        <ul id="a-refs-list"></ul>
      </section>

      <section class="related" id="a-related" aria-label="Related articles"></section>

      <div class="share-row" id="a-share"></div>

      <div class="comments" id="c-section">
        <h3 style="margin-bottom:16px;">💬 Comments <span id="c-count" class="chip"></span></h3>
        <div class="demo-banner"><b>Demo mode:</b> Comments are stored in your browser (localStorage) only. No server — they won't appear for other visitors.</div>
        <form class="comment-form" id="c-form" onsubmit="ivSubmitComment(event)">
          <input id="c-name" type="text" placeholder="Your name" required />
          <textarea id="c-text" rows="3" placeholder="Share your thoughts…" required></textarea>
          <button class="btn btn-primary" type="submit">Post Comment</button>
        </form>
        <div id="comments-list" style="margin-top:20px;"></div>
      </div>
    </div>

    <!-- Table of contents sidebar -->
    <aside class="toc-side" id="a-toc" style="display:none;">
      <div class="toc-inner">
        <h4>📑 Contents</h4>
        <nav id="a-toc-list"></nav>
      </div>
    </aside>
  </article>

  <div data-chrome-footer></div>
  <div data-chrome-floating></div>

  <script src="assets/js/components.js"></script>
  <script src="data/articles.js"></script>
  <script src="data/notes.js"></script>
  <script src="data/pdfs.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    function showNotFound() {
      document.getElementById("a-title").textContent = "Article not found";
      document.getElementById("a-tags").innerHTML = "";
      document.getElementById("a-author").textContent = "—";
      document.getElementById("a-date").textContent = "";
      document.getElementById("a-read").textContent = "";
      document.getElementById("a-cover").textContent = "🔍";
      document.getElementById("a-media").innerHTML = "";
      document.getElementById("a-body").innerHTML =
        `<div class="not-found"><p>The article you're looking for doesn't exist or may have been moved.</p>
         <a class="btn btn-primary" href="articles.html">← Back to Articles</a></div>`;
      const c = document.getElementById("c-section"); if (c) c.style.display = "none";
      const s = document.getElementById("a-share"); if (s) s.style.display = "none";
      const t = document.getElementById("a-toc"); if (t) t.style.display = "none";
    }

    function ivSetMeta(sel, attr, val) {
      let m = document.head.querySelector(sel);
      if (!m) { m = document.createElement("meta"); m.setAttribute(attr, sel.split('"')[1]); document.head.appendChild(m); }
      m.setAttribute("content", val);
    }
    function applyArticleSEO(art, url) {
      ivSetMeta('meta[name="description"]', "name", art.excerpt);
      let can = document.head.querySelector('link[rel="canonical"]');
      if (!can) { can = document.createElement("link"); can.rel = "canonical"; document.head.appendChild(can); }
      can.href = url.split("?")[0];
      ivSetMeta('meta[property="og:title"]', "property", art.title);
      ivSetMeta('meta[property="og:description"]', "property", art.excerpt);
      ivSetMeta('meta[property="og:url"]', "property", can.href);
      ivSetMeta('meta[property="og:type"]', "property", "article");
      const OG_DEFAULT = "https://umee02199.github.io/infovibe/assets/img/og-default.png";
      const mediaForShare = (art.media && art.media.kind === "image" && art.media.path) ? art.media.path : OG_DEFAULT;
      ivSetMeta('meta[property="og:image"]', "property", mediaForShare);
      let json = document.getElementById("iv-jsonld");
      if (!json) { json = document.createElement("script"); json.type = "application/ld+json"; json.id = "iv-jsonld"; document.head.appendChild(json); }
      json.textContent = JSON.stringify({
        "@context": "https://schema.org", "@type": "Article",
        "headline": art.title, "author": { "@type": "Person", "name": art.author },
        "datePublished": art.date, "dateModified": art.updated || art.date, "image": mediaForShare,
        "publisher": { "@type": "Organization", "name": IV.siteName },
        "keywords": (art.tags || []).join(", ")
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const S = window.InfoVibeStore;
      const id = new URLSearchParams(location.search).get("id");
      const a = S.getArticle(id);
      if (!a) { showNotFound(); return; }

      S.bumpView(a.id); // popular tracking

      document.title = a.title + " — InfoVibe";
      document.getElementById("a-title").textContent = a.title;
      document.getElementById("a-desc").textContent = a.excerpt || "";
      document.getElementById("a-tags").innerHTML = `<span class="tag">${ivCat(a.category).emoji} ${ivCat(a.category).name}</span>` +
        (a.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join("");
      document.getElementById("a-author").textContent = a.author;
      document.getElementById("a-avatar").textContent = a.author[0];
      const upd = a.updated && a.updated !== a.date ? ` · Updated ${ivFmtDate(a.updated)}` : "";
      document.getElementById("a-date").textContent = "📅 " + ivFmtDate(a.date) + upd;
      document.getElementById("a-read").textContent = "🕒 " + a.readTime + " min read";

      const mediaEl = document.getElementById("a-media");
      const mediaSrc = a.media ? (a.media.dataUrl || a.media.path || "") : "";
      if (a.media && a.media.kind === "image") {
        document.getElementById("a-cover").style.display = "none";
        mediaEl.innerHTML = `<img class="article-media-img" src="${mediaSrc}" alt="${esc(a.title)} cover" loading="lazy" />`;
      } else if (a.media && a.media.kind === "pdf") {
        document.getElementById("a-cover").textContent = "📄";
        mediaEl.innerHTML = `<a class="file-chip pdf-link" href="${mediaSrc}" target="_blank" rel="noopener">📄 View / Download PDF (${esc(a.media.name)})</a>`;
      } else {
        document.getElementById("a-cover").textContent = a.cover || "📄";
        mediaEl.innerHTML = "";
      }

      // Inject body, then build TOC from h2/h3
      document.getElementById("a-body").innerHTML = a.body;
      buildTOC(document.getElementById("a-body"));

      // References
      if (a.references && a.references.length) {
        document.getElementById("a-refs").style.display = "block";
        document.getElementById("a-refs-list").innerHTML = a.references.map(r =>
          `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)} ↗</a></li>`).join("");
      }

      const rel = S.getPublishedArticles().filter(x => x.id !== a.id && x.category === a.category).slice(0, 3);
      const relEl = document.getElementById("a-related");
      if (rel.length) {
        relEl.innerHTML = `<h3 class="related-title">📚 Related in ${ivCat(a.category).name}</h3>` +
          rel.map(x => `<a class="related-card" href="article.html?id=${x.slug || x.id}">
            <span class="related-emoji">${x.cover || "📄"}</span>
            <span class="related-meta"><b>${esc(x.title)}</b><small>${x.readTime} min read</small></span>
          </a>`).join("");
      } else { relEl.style.display = "none"; }

      const url = location.href.split("?")[0] + "?id=" + (a.slug || a.id);
      applyArticleSEO(a, url);
      document.getElementById("a-share").innerHTML = `
        <a class="share-btn" href="https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(a.title)}" target="_blank" rel="noopener">𝕏 Share</a>
        <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank" rel="noopener">📘 Facebook</a>
        <a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}" target="_blank" rel="noopener">🔗 LinkedIn</a>
        <a class="share-btn" href="https://wa.me/${IV.whatsapp}?text=${encodeURIComponent("Check this out: " + a.title + " " + url)}" target="_blank" rel="noopener">💬 WhatsApp</a>`;

      function refresh() {
        const list = ivGetComments(a.id);
        document.getElementById("c-count").textContent = "(" + list.length + ")";
        ivRenderComments(a.id);
      }
      window.ivSubmitComment = function (e) {
        e.preventDefault();
        const name = document.getElementById("c-name").value.trim();
        const text = document.getElementById("c-text").value.trim();
        if (!name || !text) return;
        ivAddComment(a.id, name, text);
        document.getElementById("c-form").reset();
        refresh();
        ivToast("Comment posted (saved locally)");
      };
      refresh();

      function buildTOC(container) {
        const heads = container.querySelectorAll("h2, h3");
        if (heads.length < 2) return;
        const side = document.getElementById("a-toc");
        const nav = document.getElementById("a-toc-list");
        let html = "";
        heads.forEach((h, i) => {
          if (!h.id) h.id = "sec-" + i;
          const cls = h.tagName === "H3" ? "sub" : "";
          html += `<a class="${cls}" href="#${h.id}">${esc(h.textContent)}</a>`;
        });
        nav.innerHTML = html;
        side.style.display = "block";
        // scroll-spy
        const links = [...nav.children];
        const obs = new IntersectionObserver(entries => {
          entries.forEach(en => {
            if (en.isIntersecting) {
              links.forEach(l => l.classList.remove("active"));
              const act = links.find(l => l.getAttribute("href") === "#" + en.target.id);
              if (act) act.classList.add("active");
            }
          });
        }, { rootMargin: "-20% 0px -70% 0px" });
        heads.forEach(h => obs.observe(h));
      }
    });
  </script>
</body>
</html>
